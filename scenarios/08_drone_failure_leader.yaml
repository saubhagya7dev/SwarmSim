name: 08_drone_failure_leader
description: Drone 0 (leader in leader-follower mode) suffers total motor failure. Expected - re-election by heartbeat (or no election needed in consensus mode) and the mission continues.
tags: [airframe, failure, leader-loss]
allowed_losses: 1
faults:
  - {type: drone_failure, drone: 0, t: 40.0, t_jitter: 5.0}
criteria:
  detection_time_s: {max: 4.0}
  recovery_time_s: {max: 15.0}
